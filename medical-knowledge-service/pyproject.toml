[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-knowledge-service"
version = "1.0.0"
description = "医学知识库向量检索服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["medical_knowledge_service"]

[tool.setuptools.package-data]
medical_knowledge_service = ["py.typed"]

[project.scripts]
medical-knowledge-api = "medical_knowledge_service.api.main:main"

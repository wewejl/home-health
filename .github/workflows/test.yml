# GitHub Actions 测试流水线
#
# 触发条件：
# - push 到 main 或 develop 分支
# - 针对 main 或 develop 的 Pull Request
#
# 测试内容：
# - 后端：pytest 单元测试 + 覆盖率报告
# - 前端：vitest 单元测试 + Playwright E2E 测试
# - iOS：xcodebuild 单元测试

name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 取消同一 PR 的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 后端测试
  # ============================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: home_health_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/home_health_test
      TEST_MODE: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock httpx

      - name: Run linters
        working-directory: ./backend
        run: |
          black --check .
          isort --check-only .
          flake8 . --max-line-length=100 || true

      - name: Run tests with coverage
        working-directory: ./backend
        run: |
          pytest test/ -v --cov=app --cov-report=xml --cov-report=term --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/htmlcov/

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results/

  # ============================================
  # 前端单元测试
  # ============================================
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint || true

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test -- --run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend-unit
          name: frontend-unit-coverage
          fail_ci_if_error: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-coverage
          path: frontend/coverage/

  # ============================================
  # 前端 E2E 测试
  # ============================================
  frontend-e2e-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 需要 API 服务运行
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: home_health_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Python for backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start backend server
        working-directory: ./backend
        run: |
          export DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/home_health_test
          export TEST_MODE=true
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8100 &
          echo $! > backend.pid
          # 等待服务启动
          for i in {1..30}; do
            if curl -s http://localhost:8100/docs > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          CI: true
        run: npx playwright test

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7

  # ============================================
  # iOS 单元测试
  # ============================================
  ios-tests:
    name: iOS Tests
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve dependencies
        working-directory: ./ios
        run: |
          xcodebuild -resolvePackageDependencies -workspace xinlingyisheng.xcodeproj/project.xcworkspace -scheme xinlingyisheng

      - name: Run iOS unit tests
        working-directory: ./ios
        run: |
          xcodebuild test \
            -workspace xinlingyisheng.xcodeproj/project.xcworkspace \
            -scheme xinlingyisheng \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            | xcpretty || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult

      - name: Generate coverage report
        if: always()
        working-directory: ./ios
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-coverage
          path: ios/coverage.json

  # ============================================
  # 测试报告汇总
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests, frontend-e2e-tests, ios-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Backend tests: ${{ needs.backend-tests.result }}"
          echo "Frontend unit tests: ${{ needs.frontend-unit-tests.result }}"
          echo "Frontend E2E tests: ${{ needs.frontend-e2e-tests.result }}"
          echo "iOS tests: ${{ needs.ios-tests.result }}"

          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.ios-tests.result }}" != "success" ]; then
            echo "::error::One or more test jobs failed"
            exit 1
          fi

          echo "::notice::All tests passed!"

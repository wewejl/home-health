services:
  # PostgreSQL数据库 (含 pgvector 扩展)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: home_health_db
    environment:
      POSTGRES_DB: home_health
      POSTGRES_USER: postgres
      # ⚠️ 安全警告: 生产环境必须设置强密码
      # 生成命令: openssl rand -base64 32
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backups

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: home-health-backend
    # 开发模式：挂载本地代码，修改后无需重新构建
    volumes:
      - ./backend:/app
      # 排除不需要挂载的目录
      - /app/venv
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      # 数据库配置
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/home_health?options=-c%20timezone%3DUTC

      # JWT 配置 - ⚠️ 生产环境必须设置强密钥
      # 生成命令: python -c "import secrets; print(secrets.token_urlsafe(32))"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}

      # 测试模式配置（生产环境必须为 false）
      ADMIN_TEST_MODE: ${ADMIN_TEST_MODE:-false}
      TEST_MODE: ${TEST_MODE:-false}

      # 生产环境配置
      DEBUG: ${DEBUG:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # 知识库服务配置
      KNOWLEDGE_SERVICE_URL: http://medical-knowledge-api:8200
      # 安全默认：即使未显式配置也启用 API Key 鉴权
      KNOWLEDGE_SERVICE_API_KEY: ${KNOWLEDGE_SERVICE_API_KEY:-change-me-knowledge-key}

      # AI 后端网关配置（Phase 1）
      AI_ENGINE_MODE: ${AI_ENGINE_MODE:-legacy}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://home-health-ai:8300}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-change-me-internal-token}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-20}
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-3}
      AI_SERVICE_MAX_RETRIES: ${AI_SERVICE_MAX_RETRIES:-1}
      AI_SERVICE_RETRY_BACKOFF_MS: ${AI_SERVICE_RETRY_BACKOFF_MS:-200}
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      medical-knowledge-api:
        condition: service_healthy
      home-health-ai:
        condition: service_healthy
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 独立 AI 编排服务（主智能体 + 检索子智能体）
  home-health-ai:
    build:
      context: ./home-health-ai
      dockerfile: Dockerfile
    container_name: home-health-ai
    volumes:
      - ./home-health-ai:/app
      - /app/__pycache__
    environment:
      DEBUG: ${DEBUG:-false}
      INTERNAL_API_TOKEN: ${AI_SERVICE_TOKEN:-change-me-internal-token}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-900}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      KNOWLEDGE_SERVICE_URL: http://medical-knowledge-api:8200
      KNOWLEDGE_SERVICE_API_KEY: ${KNOWLEDGE_SERVICE_API_KEY:-change-me-knowledge-key}
      KNOWLEDGE_SERVICE_TIMEOUT: ${KNOWLEDGE_SERVICE_TIMEOUT:-10}
      KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-5}
    ports:
      - "8300:8300"
    depends_on:
      medical-knowledge-api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 独立医学知识库服务
  medical-knowledge-api:
    build:
      context: ./medical-knowledge-service
      dockerfile: Dockerfile
    container_name: medical-knowledge-api
    environment:
      # 使用与主业务相同的数据库，避免新环境下因数据库不存在导致启动失败
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/home_health
      # 使用独立向量表，避免与主业务旧 knowledge_vectors 结构冲突
      VECTOR_TABLE: medical_knowledge_vectors
      # 安全默认：避免 dev-key 放行导致未鉴权访问
      API_KEY: ${KNOWLEDGE_SERVICE_API_KEY:-change-me-knowledge-key}
      EMBEDDING_PROVIDER: mock
      DIMENSION: 1024
    ports:
      - "8200:8200"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: home_health_redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_data:/data

  # 前端Web服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: home-health-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
  postgres_backup:
  redis_data:

# 环境变量说明（创建 .env 文件配置以下变量）:
# POSTGRES_PASSWORD=your_strong_password_here
# JWT_SECRET_KEY=your_jwt_secret_key_here
# ADMIN_JWT_SECRET=your_admin_jwt_secret_here
# ADMIN_TEST_MODE=false
# TEST_MODE=false
# DEBUG=false
# CORS_ALLOWED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
